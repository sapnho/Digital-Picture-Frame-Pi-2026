<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Picture Frame</title>
<script>
  /* Stamped before the stylesheet paints, so the page never flashes the wrong
     theme on its way to the right one.  Deliberately tiny and inline: a
     separate file would be fetched after the first paint, which is the flash
     this exists to prevent.  "auto" leaves no attribute, so the CSS media
     query decides and keeps following the device if the user changes it. */
  (function () {
    var choice = "auto";
    try { choice = localStorage.getItem("picframe3-theme") || "auto"; } catch (e) {}
    if (choice === "light" || choice === "dark") {
      document.documentElement.dataset.theme = choice;
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="dot" id="live"></span>
    <strong>Picture&nbsp;Frame</strong>
    <span class="muted" id="display-info"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="now">Now playing</button>
    <button class="tab" data-view="library">Library</button>
    <button class="tab" data-view="settings">Settings</button>
    <select id="theme" title="Light or dark" aria-label="Theme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </nav>
</header>

<main>
  <!-- ---------------------------------------------------------- Now -->
  <section id="view-now" class="view is-active">
    <div class="stage">
      <img id="preview" alt="" hidden>
      <div id="preview-empty" class="empty">No picture yet</div>
      <div class="progress"><span id="progress-bar"></span></div>
      <span id="live-badge" class="badge-live" hidden>live screen</span>
    </div>

    <div class="meta">
      <h1 id="title">—</h1>
      <p id="subtitle" class="muted"></p>
      <ul id="exif" class="chips"></ul>
    </div>

    <div class="controls">
      <button id="prev" class="btn" title="Previous (←)">‹ Prev</button>
      <button id="pause" class="btn btn-primary">Pause</button>
      <button id="next" class="btn" title="Next (→)">Next ›</button>
      <button id="power" class="btn">Screen off</button>
      <button id="shot" class="btn" title="Capture what is actually on the frame's screen">Screenshot</button>
      <button id="del" class="btn btn-danger" title="Move this picture out of the library">Remove</button>
    </div>

    <div class="sliders">
      <label>Brightness <output id="brightness-out">100%</output>
        <input id="brightness" type="range" min="5" max="100" value="100">
      </label>
      <label>Seconds per picture <output id="interval-out">180</output>
        <input id="interval" type="range" min="5" max="900" step="5" value="180">
      </label>
    </div>

    <dl class="stats" id="stats"></dl>
  </section>

  <!-- ------------------------------------------------------ Library -->
  <section id="view-library" class="view">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search titles, captions, tags, places…" autocomplete="off">
      <select id="folder"><option value="">All folders</option></select>
      <button id="rescan" class="btn">Rescan</button>
    </div>
    <div id="grid" class="grid"></div>
    <p id="grid-empty" class="empty" hidden>Nothing matches.</p>
  </section>

  <!-- ----------------------------------------------------- Settings -->
  <section id="view-settings" class="view">
    <div class="toolbar">
      <input id="settings-search" type="search" autocomplete="off"
             placeholder="Search every setting…">
      <label class="inline"><input id="settings-advanced" type="checkbox">
        Show advanced</label>
    </div>
    <div id="restart-notice" class="notice" hidden>
      <div>
        <strong id="restart-headline"></strong>
        <p id="restart-detail" class="muted"></p>
      </div>
      <button id="restart-now" class="btn btn-primary" type="button">Save &amp; restart</button>
    </div>

    <form id="settings"></form>
    <div class="controls">
      <button id="save" class="btn btn-primary" type="button">Save to config file</button>
      <button id="reload" class="btn" type="button">Reload from file</button>
      <button id="restart" class="btn" type="button"
              title="Stop the frame and start it again">Restart the frame</button>
    </div>
    <pre id="saved" class="muted"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
